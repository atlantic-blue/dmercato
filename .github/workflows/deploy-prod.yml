name: Deploy Production

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --coverage

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap prod backend
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap prod state backend
        run: bash scripts/bootstrap-terraform.sh prod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: infra/environments/prod
        run: terraform init

      - name: Terraform plan
        working-directory: infra/environments/prod
        run: terraform plan -out=tfplan -var="environment=prod" -var="project_name=dmercato" -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra/environments/prod
        run: terraform apply tfplan
